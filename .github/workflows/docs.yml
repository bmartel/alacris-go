name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'live/assets/**'
      - 'AGENTS.md'
      - 'internal/docsgen/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Never deploy two builds at once, but let a newer commit supersede an
# in-flight one — the site should end up matching main.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      # Every Go example on the site is extracted from internal/docsgen and
      # executed, so the committed JSON has to match the library before the
      # site is built from it.
      - name: Examples are current
        run: go run ./internal/docsgen -check

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build the docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # verify the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
