# Keeps the vendored alacris runtime in step with upstream.
#
# The module ships a copy of the JavaScript so a Go project needs no npm; the
# cost is that the copy goes stale silently. CI's `vendorjs -check` catches
# drift from the *pinned* version — this workflow is the other half: it
# notices a *new* version, vendors it with `vendorjs -bump` (which verifies
# the tarball against the registry's integrity hash and rewrites
# RuntimeVersion and the pinned test hashes), proves the module still works
# against it — unit, race and real-browser tests — and opens a PR. The human
# judgement left is reviewing that PR against upstream's changelog.
name: Vendor sync

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-release, alacris-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Bump to the latest published runtime and UI components
        id: bump
        run: |
          go run ./internal/vendorjs -bump
          go run ./internal/genui
          go run ./cmd/alacris-go generate ./examples/todo/web -o ./examples/todo/ui -strip ala-
          go run ./internal/docsgen
          core_version=$(sed -n 's/.*RuntimeVersion = "\(.*\)".*/\1/p' runtime.go)
          ui_version=$(sed -n 's/.*UIVersion = "\(.*\)".*/\1/p' runtime.go)
          echo "core_version=$core_version" >> "$GITHUB_OUTPUT"
          echo "ui_version=$ui_version" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "alacris@$core_version and @alacris/ui@$ui_version are already vendored and current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The new runtime has to earn the bump: the same gates a hand-made
      # change passes, including the browser suite — a runtime release is
      # exactly the change most likely to break real-DOM behaviour that the
      # Go tests cannot see.
      - name: Test
        if: steps.bump.outputs.changed == 'true'
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
          go run ./cmd/alacris-go check ./examples/todo/web -o ./examples/todo/ui -strip ala-
          go run ./internal/docsgen -check
          go run ./internal/vendorjs -check
          go run ./internal/genui -check

      - name: Browser tests
        timeout-minutes: 20
        if: steps.bump.outputs.changed == 'true'
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
          go build -o /dev/null ../examples/todo
          npx playwright test

      - name: Open a pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: vendor/alacris-${{ steps.bump.outputs.core_version }}-${{ steps.bump.outputs.ui_version }}
          delete-branch: true
          commit-message: |
            feat(vendor): vendor alacris ${{ steps.bump.outputs.core_version }} and @alacris/ui ${{ steps.bump.outputs.ui_version }}

            Vendored by the vendor-sync workflow:
            - tarballs verified against the registry's dist.integrity
            - RuntimeVersion, UIVersion and pinned hashes rewritten by vendorjs -bump
            - Go UI component wrappers regenerated by genui
            - Example component wrappers regenerated by alacris-go generate
            - unit + race + playwright browser suites green.
          title: 'feat(vendor): alacris ${{ steps.bump.outputs.core_version }} / ui ${{ steps.bump.outputs.ui_version }}'
          body: |
            Upstream published alacris **${{ steps.bump.outputs.core_version }}** and @alacris/ui **${{ steps.bump.outputs.ui_version }}**; this PR vendors them.

            Everything mechanical is already done and proven:

            - tarball verified against the registry's `dist.integrity` before a byte was written
            - `RuntimeVersion`, `UIVersion` and the `vendoredHashes` pins rewritten by `vendorjs -bump`
            - Go component wrappers regenerated via `genui`
            - `go test -race ./...` and the Playwright browser suite pass against the new runtime

            Merging this PR will automatically publish a new release of `alacris-go`.
