name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A second push while a release is mid-flight would race
# on the changelog commit and the git tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # commit the changelog, push the tag, create the release
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The concurrency group above does not cancel in progress, so a hung
    # release blocks every release behind it for as long as it hangs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release reads the whole tag history
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      # A Go module release is a git tag, and a tag cannot be taken back once
      # proxy.golang.org has cached it. Nothing ships unless the whole suite
      # passes on the exact commit being tagged.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Generated wrappers are up to date
        run: go run ./cmd/alacris-go check ./examples/todo/web -o ./examples/todo/ui -strip ala-

      - name: Documentation examples are current
        run: go run ./internal/docsgen -check

      - name: Vendored runtime matches npm
        run: go run ./internal/vendorjs -check

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Consumers of github.com/bmartel/alacris-go/app need a tag app/vX.Y.Z.
      # The root module's replace => ./app is ignored outside this repo.
      - name: Tag the app nested module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "${VERSION}" ]; then
            echo "No vX.Y.Z tag on HEAD; no release this run"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/app/${VERSION}" >/dev/null 2>&1; then
            echo "app/${VERSION} already exists"
            exit 0
          fi
          git tag "app/${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "app/${VERSION}"
